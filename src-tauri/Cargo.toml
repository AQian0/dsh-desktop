[package]
name = "dsh-desktop"
version = "0.2.1"
description = "Desktop shell that wraps the DeepSeek Harness web runtime (built with Tauri 2)"
license = "MIT"
edition = "2021"
authors = ["aqian0"]
repository = "https://github.com/AQian0/dsh-desktop"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
libc = "0.2"
open = "5"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
