# The @aqian0/dsh-desktop-plugin bundle patch: opens the DeepSeek
# Harness Web surface in a Tauri desktop window. It rides over dsh-base +
# dsh-web-app (the desktop profile lists all three, so this layer inherits
# the whole Web runtime and only adds one host row).
#
# dsh-web-app's web-runtime row follows its CLI default and hands the URL to
# the operating system's default browser unless `--no-open` is passed. The
# desktop window replaces that browser handoff, so this layer pins
# openBrowser to false. A patch replaces the targeted row's whole `config`,
# so every upstream key is restated here.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: true
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts

# The row mounts after the Web connection is ready and spawns the shell binary
# attached to its authenticated loopback URL, tying the profile's lifetime to the window:
# closing the window requests a graceful app exit, and disposing the tree
# (a signal, or another app's exit) closes the shell.
#
# The row carries no config: the shell binary resolves from the row's bin
# override, then DSH_DESKTOP_BIN, then a binary bundled beside this package,
# then `dsh-desktop` on PATH. Pin an explicit executable here or in the
# profile's cordis.patch.yml when needed.

- insert:
    - id: desktop-launch
      name: '@aqian0/dsh-desktop-plugin'
      inject: [webServer, connection, appExit]
